[package]
name = "sts2-sim"
version = "0.1.0"
edition = "2024"

[lib]
name = "sts2_sim"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:numpy", "dep:pyo3", "dep:rayon"]

[dependencies]
numpy = { version = "0.25", optional = true }
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
rayon = { version = "1", optional = true }
serde_json = "1"
