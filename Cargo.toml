[package]
name = "sts2-sim"
version = "0.1.0"
edition = "2024"

[lib]
name = "sts2_sim"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:libc", "dep:mimalloc", "dep:numpy", "dep:pyo3", "dep:rayon", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
numpy = { version = "0.25", optional = true }
libc = { version = "0.2", optional = true }
mimalloc = { version = "0.1", optional = true }
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
rayon = { version = "1", optional = true }
serde_json = "1"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"], optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
